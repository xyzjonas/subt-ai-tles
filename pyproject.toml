[project]
name = "subt-ai-tles-workspace"
version = "0.0.2"
description = "Workspace root (not published). See src/lib and src/app."
requires-python = ">=3.11"
dependencies = ["subt-ai-tles"]

[tool.uv]
package = false

[tool.uv.sources]
subt-ai-tles = { workspace = true }

[tool.uv.workspace]
members = ["src/lib", "src/app"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest-asyncio>=0.23.2,<1.0.0",
    "pytest-dotenv<1.0.0,>=0.5.2",
    "pytest<8.0.0,>=7.4.3",
    "ruff>=0.13.1",
    "tox>=4.30.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto" # or "strict"
testpaths = ["src/lib/tests", "src/app/backend/tests"]

[tool.ruff]
# Target Python version
target-version = "py313"

# Line length
line-length = 95

# Enable ALL available rule categories
lint.select = [
    # Pyflakes (F)
    "F",
    # pycodestyle errors (E) and warnings (W)
    "E", "W",
    # mccabe complexity (C90)
    "C90",
    # isort (I)
    "I",
    # pep8-naming (N)
    "N",
    # pydocstyle (D)
    "D",
    # pyupgrade (UP)
    "UP",
    # flake8-2020 (YTT)
    "YTT",
    # flake8-annotations (ANN)
    "ANN",
    # flake8-async (ASYNC)
    "ASYNC",
    # flake8-bandit (S)
    "S",
    # flake8-blind-except (BLE)
    "BLE",
    # flake8-boolean-trap (FBT)
    "FBT",
    # flake8-bugbear (B)
    "B",
    # flake8-builtins (A)
    "A",
    # flake8-commas (COM)
    "COM",
    # flake8-comprehensions (C4)
    "C4",
    # flake8-datetime (DTZ)
    "DTZ",
    # flake8-debugger (T10)
    "T10",
    # flake8-django (DJ)
    "DJ",
    # flake8-errmsg (EM)
    "EM",
    # flake8-executable (EXE)
    "EXE",
    # flake8-future-annotations (FA)
    "FA",
    # flake8-implicit-str-concat (ISC)
    "ISC",
    # flake8-import-conventions (ICN)
    "ICN",
    # flake8-logging-format (G)
    "G",
    # flake8-no-pep420 (INP)
    "INP",
    # flake8-pie (PIE)
    "PIE",
    # flake8-print (T20)
    "T20",
    # flake8-pyi (PYI)
    "PYI",
    # flake8-pytest-style (PT)
    "PT",
    # flake8-quotes (Q)
    "Q",
    # flake8-raise (RSE)
    "RSE",
    # flake8-return (RET)
    "RET",
    # flake8-self (SLF)
    "SLF",
    # flake8-simplify (SIM)
    "SIM",
    # flake8-slots (SLOT)
    "SLOT",
    # flake8-tidy-imports (TID)
    "TID",
    # flake8-type-checking (TCH)
    "TCH",
    # flake8-gettext (INT)
    "INT",
    # flake8-unused-arguments (ARG)
    "ARG",
    # flake8-use-pathlib (PTH)
    "PTH",
    # pandas-vet (PD)
    "PD",
    # pygrep-hooks (PGH)
    "PGH",
    # Pylint (PL)
    "PL",
    # tryceratops (TRY)
    "TRY",
    # flynt (FLY)
    "FLY",
    # NumPy-specific rules (NPY)
    "NPY",
    # Airflow (AIR)
    "AIR",
    # Perflint (PERF)
    "PERF",
    # refurb (FURB)
    "FURB",
    # flake8-logging (LOG)
    "LOG",
    # Ruff-specific rules (RUF)
    "RUF",
]

# Ignore specific rules that might be too strict or conflicting
lint.ignore = [
    # These are commonly ignored rules that might be too strict:
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
    "D203",  # conflict with the formatter
    "D211",
    "D213",
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"src/app/backend/migrations/*" = ["INP001"]
"src/app/backend/migrations/versions/*" = ["INP001", "D", "E501", "I", "Q", "UP", "W291", "W293", "ANN"]
"src/app/backend/tests/*" = ["PLR2004", "ANN", "S105", "S106", "D", "E501", "PLR0913"]
