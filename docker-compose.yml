x-app-env: &app-env
  DATABASE_URL: sqlite:////data/subtaitles.db
  REDIS_URL: redis://redis:6379/0
  CACHE_REDIS_URL: redis://redis-cache:6379/0
  OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
  TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env}
  OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  web:
    build: .
    image: subt-ai-tles-app
    ports:
      - "9142:80"
    environment: *app-env
    volumes:
      - data:/data
    depends_on:
      - redis
      - redis-cache
    restart: unless-stopped

  worker:
    image: subt-ai-tles-app
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    environment: *app-env
    volumes:
      - data:/data
    depends_on:
      - web
      - redis
      - redis-cache
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Celery BROKER only. Never evicts: dropping a key here would lose a queued job.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    # CACHE ONLY (translation cache). Nothing else may be stored here: with allkeys-lru, any key
    # can be evicted once the memory cap is hit. Entries never expire, the oldest-unused go first.
    command: >
      redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped

volumes:
  data:
  redis-data:
  redis-cache-data:
